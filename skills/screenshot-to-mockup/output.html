<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!-- Example mockup for a fictional product. All colors are neutral placeholders. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 800px;
    background: #F0F0F3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.07);
    width: 800px;
    padding: 52px 56px;
  }
  .g { background: #E8E8E8; border-radius: 6px; }
  .chart-row { display: flex; align-items: center; margin-bottom: 20px; }
  .chart-row:last-child { margin-bottom: 0; }
  .label-col { width: 140px; flex-shrink: 0; display: flex; justify-content: flex-end; padding-right: 16px; }
  .bar-col { flex: 1; }
</style>
</head>
<body>
<div class="card">

  <!-- Nav: 4 ghost tabs + action button + green tick, all in one row, well spaced -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:64px;">
    <div style="display:flex;align-items:center;">
      <div class="g" style="height:11px;width:44px;background:#B7CDF8;margin-right:32px;"></div>
      <div class="g" style="height:11px;width:56px;margin-right:32px;"></div>
      <div class="g" style="height:11px;width:40px;margin-right:32px;"></div>
      <div class="g" style="height:11px;width:68px;"></div>
    </div>
    <div style="display:flex;align-items:center;">
      <!-- Action pill button -->
      <div style="display:flex;align-items:center;background:#F2F2F2;border-radius:8px;padding:8px 14px;margin-right:60px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:7px;">
          <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z" fill="#555"/>
        </svg>
        <span style="font-size:12.5px;font-weight:500;color:#333;">Edit</span>
      </div>
      <!-- Green tick -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="#22A55B" stroke-width="2"/>
        <path d="M7.5 12l3 3 6-6" stroke="#22A55B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- Two ghost text lines -->
  <div style="margin-bottom:52px;">
    <div class="g" style="height:16px;width:88%;margin-bottom:24px;"></div>
    <div class="g" style="height:16px;width:64%;"></div>
  </div>

  <!-- Focal pill + badge -->
  <div style="display:flex;align-items:center;margin-bottom:52px;">
    <div style="display:inline-flex;align-items:center;background:#E8F0FD;border-radius:100px;padding:12px 22px;margin-right:12px;">
      <span style="font-size:15px;font-weight:600;color:#1E4FB8;white-space:nowrap;">"Faster setup for new users"</span>
    </div>
    <div style="width:30px;height:30px;background:#2F6FEB;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;">18</div>
  </div>

  <!-- Chart -->
  <div style="border:1px solid #F0F0F0;border-radius:12px;padding:26px 28px;">
    <div class="g" style="height:11px;width:140px;margin-bottom:28px;"></div>
    <div style="display:flex;flex-direction:column;">

      <div class="chart-row">
        <div class="label-col"><div class="g" style="height:11px;width:110px;"></div></div>
        <div class="bar-col"><div style="height:24px;width:100%;background:#2F6FEB;border-radius:4px;"></div></div>
      </div>
      <div class="chart-row">
        <div class="label-col"><div class="g" style="height:11px;width:90px;"></div></div>
        <div class="bar-col"><div style="height:24px;width:76%;background:#5A8DF0;border-radius:4px;"></div></div>
      </div>
      <div class="chart-row">
        <div class="label-col"><div class="g" style="height:11px;width:105px;"></div></div>
        <div class="bar-col"><div style="height:24px;width:58%;background:#8AAEF4;border-radius:4px;"></div></div>
      </div>
      <div class="chart-row">
        <div class="label-col"><div class="g" style="height:11px;width:80px;"></div></div>
        <div class="bar-col"><div style="height:24px;width:44%;background:#B7CDF8;border-radius:4px;"></div></div>
      </div>
      <div class="chart-row">
        <div class="label-col"><div class="g" style="height:11px;width:95px;"></div></div>
        <div class="bar-col"><div style="height:24px;width:32%;background:#DDE8FC;border-radius:4px;"></div></div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
